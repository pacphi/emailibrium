# docker-compose.yml — Full-stack Emailibrium
# Usage: docker compose up -d
# Secrets: place in secrets/ directory (gitignored), see secrets/dev.example/

services:
  # ─── Backend API (Rust) ───────────────────────────────────
  backend:
    build:
      # Repo root: backend/Cargo.toml path-depends on the vendored ruvector
      # submodule, which is outside backend/. See backend/Dockerfile.
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
      args:
        RUST_VERSION: "1.97"
    container_name: emailibrium-backend
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=100M,mode=1777
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # ── Which database? ────────────────────────────────────────────────
      # SQLite (default) vs PostgreSQL is decided by ONE value: the connection
      # URL's scheme (ADR-033). There is no separate backend flag.
      #
      #   SQLite (default)  docker compose up -d
      #   PostgreSQL        EMAILIBRIUM_DATABASE_URL=postgres://emailibrium:<pw>@postgres:5432/emailibrium \
      #                       docker compose --profile postgres up -d
      #
      # The --profile flag is what starts the `postgres` service (see its comment
      # below); this variable is what points the app at it. Leaving the variable
      # unset falls back to the `database_url` secret, then to the SQLite default in
      # config/environments/config.*.yaml — entrypoint.sh explains the precedence.
      #
      # BEHAVIOR CHANGE, read this if you are upgrading: this variable used to be inert.
      # Setting it did nothing (the app never read it), so a value left in your shell or
      # in this project's `.env` from an earlier attempt was harmless. It is live now, and
      # Compose substitutes `.env` here — so a stale value will silently move you onto a
      # different database. The startup log names the endpoint, not just the driver, so
      # check the backend's first lines after upgrading if you are unsure which one you
      # are on.
      EMAILIBRIUM_DATABASE_URL: ${EMAILIBRIUM_DATABASE_URL:-}
      # Non-secret config via env vars (12-factor)
      APP_ENV: ${APP_ENV:-development}
      RUST_LOG: ${RUST_LOG:-emailibrium=info,tower_http=info}
      REDIS_URL: redis://redis:6379
      EMAILIBRIUM_STORE_BACKEND: ${STORE_BACKEND:-ruvector}
      # KNOWN DEAD, disclosed rather than quietly left looking functional: this value
      # never reaches the app. `store.qdrant_url` is a flat multi-word field INSIDE a
      # nested struct, and neither env provider can address that shape — the split one
      # resolves it to `store.qdrant.url`, the unsplit one to `store_qdrant_url`, and
      # serde ignores both. Overriding QDRANT_URL therefore changes nothing; the app
      # keeps the compiled default. Same failure class this phase fixed for
      # EMAILIBRIUM_DATABASE_URL above, but the general fix changes the env contract for
      # several documented knobs at once, so it is recorded as
      # `pl-nested-flat-env-keys-dropped` rather than folded in here.
      EMAILIBRIUM_STORE_QDRANT_URL: ${QDRANT_URL:-http://qdrant:6334}
      VECTOR_STORE_PATH: /app/data/vectors
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./config/environments/config.${APP_ENV:-development}.yaml:/app/config.yaml:ro
      - backend_data:/app/data
    secrets:
      - jwt_secret
      - oauth_encryption_key
      - database_url
      - google_client_id
      - google_client_secret
      - microsoft_client_id
      - microsoft_client_secret
    depends_on:
      postgres:
        condition: service_healthy
        # `required: false` is load-bearing, not a hedge: `postgres` is behind a
        # profile now, and Compose rejects the whole project ("service backend
        # depends on undefined service postgres: invalid compose project") if a
        # depended-on service isn't enabled. With this, the SQLite default —
        # `docker compose up` with no profile — is a valid project again, while
        # `--profile postgres` still orders backend AFTER postgres is healthy.
        # The one thing it gives up: with the profile active but postgres failing
        # to start, backend is no longer held back — it starts, fails to connect,
        # and the stack goes red through backend's own healthcheck instead of
        # through the dependency.
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/emailibrium", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - db-internal
      - cache-internal
      - frontend-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ─── Frontend Web App (React SPA) ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: emailibrium-frontend
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # uid/gid are load-bearing, not decoration. A tmpfs mount defaults to
    # root-owned mode 755, and this container runs as 1000 — so nginx died with
    # `mkdir() "/var/cache/nginx/client_temp" failed (13: Permission denied)`.
    # Same shape as the postgres uid mismatch and the backend's read-only model
    # cache: hardening was applied without giving the process a writable path it
    # owns. Caught by .github/workflows/smoke.yml.
    tmpfs:
      - /tmp:size=50M,uid=1000,gid=1000
      - /var/cache/nginx:size=50M,uid=1000,gid=1000
      - /var/run:size=10M,uid=1000,gid=1000
    # nginx resolves `proxy_pass http://backend:8080` at CONFIG LOAD, not per
    # request, so it aborts with `host not found in upstream "backend"` if it
    # starts before the backend is resolvable. There was no depends_on at all,
    # so the two started in parallel and this was a race the frontend usually lost.
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    healthcheck:
      # 127.0.0.1, NOT localhost. nginx.conf declares `listen 80;` only (IPv4),
      # and the image's 10-listen-on-ipv6-by-default.sh entrypoint script cannot
      # add the IPv6 listener here because read_only: true makes
      # /etc/nginx/conf.d/default.conf unwritable — it logs "can not modify ...
      # (read-only file system?)" and gives up. `localhost` may then resolve to
      # ::1 first and the probe hits a port nginx never bound, so the container
      # served traffic fine while reporting unhealthy forever.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - frontend-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ─── PostgreSQL (optional, enable with --profile postgres) ─
  #
  # Opt-in, mirroring the `qdrant` service below. A SQLite deployment — the default —
  # never pulls, starts, or health-checks a database container it will not talk to:
  #
  #   SQLite (default)  docker compose up -d
  #   PostgreSQL        EMAILIBRIUM_DATABASE_URL=postgres://emailibrium:<pw>@postgres:5432/emailibrium \
  #                       docker compose --profile postgres up -d
  #
  # The profile starts this container; EMAILIBRIUM_DATABASE_URL (see the backend
  # service's environment block) is what points the app at it. Both are needed —
  # starting the container alone leaves the app on SQLite, and pointing the app at a
  # container that was never started fails to connect. <pw> must match the
  # `db_password` secret this service reads.
  postgres:
    image: postgres:16-alpine
    container_name: emailibrium-postgres
    profiles:
      - postgres
    # 70, not 999. postgres:16-alpine runs postgres as uid 70 and owns
    # /var/lib/postgresql as 70:70; 999 is the DEBIAN postgres uid, so this was
    # presumably written for postgres:16 and later switched to -alpine.
    #
    # The mismatch meant the container owned nothing it had to write. cap_add
    # could not rescue it either: Docker's added capabilities are inert for a
    # non-root user (Linux clears effective caps on the transition and Docker
    # sets no ambient caps), so the FOWNER below never applied and initdb died
    # with "could not change permissions of directory /var/lib/postgresql/data".
    # The stack could therefore never start — caught by .github/workflows/smoke.yml.
    #
    # NOTE redis below legitimately uses 999: redis:7-alpine really does use that uid.
    user: "70:70"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH
    tmpfs:
      - /tmp:size=100M
      - /var/run/postgresql:size=10M
    environment:
      POSTGRES_DB: emailibrium
      POSTGRES_USER: emailibrium
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailibrium -d emailibrium"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - db-internal
    # NO ports exposed — only backend accesses via internal network

  # ─── Redis Cache ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: emailibrium-redis
    user: "999:999"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=50M
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cache-internal
    # NO ports exposed — only backend accesses via internal network

  # ─── Qdrant Vector DB (optional, enable with STORE_BACKEND=qdrant) ─
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: emailibrium-qdrant
    profiles:
      - qdrant # Only starts when: docker compose --profile qdrant up
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=100M
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - db-internal
    # NO ports exposed — only backend accesses via internal network

# ─── Secrets (file-based, per OWASP recommendation) ──────────
secrets:
  jwt_secret:
    file: ./secrets/${APP_ENV:-dev}/jwt_secret
  oauth_encryption_key:
    file: ./secrets/${APP_ENV:-dev}/oauth_encryption_key
  database_url:
    file: ./secrets/${APP_ENV:-dev}/database_url
  db_password:
    file: ./secrets/${APP_ENV:-dev}/db_password
  google_client_id:
    file: ./secrets/${APP_ENV:-dev}/google_client_id
  google_client_secret:
    file: ./secrets/${APP_ENV:-dev}/google_client_secret
  microsoft_client_id:
    file: ./secrets/${APP_ENV:-dev}/microsoft_client_id
  microsoft_client_secret:
    file: ./secrets/${APP_ENV:-dev}/microsoft_client_secret

# ─── Volumes ─────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  backend_data:
  qdrant_data:

# ─── Networks (segmented per NIST SP 800-190) ───────────────
networks:
  db-internal:
    internal: true # No external access — only backend <-> postgres
  cache-internal:
    internal: true # No external access — only backend <-> redis
  frontend-proxy:
    driver: bridge # Frontend <-> backend communication
