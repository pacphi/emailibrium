name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental compilation only pays off across repeated local builds; in CI
  # every job starts from a restored cache, so it just bloats target/ and slows
  # the cache save/restore steps. Same for test-profile debuginfo.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Backend jobs (separate for clear failure attribution)
  rust-format:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # backend/rust-toolchain.toml is the single source of truth for the Rust
      # version. Installing bare @stable here drifts from it, and rustup would
      # silently install the pinned toolchain a second time on first cargo use
      # inside backend/ — so read the pin and install exactly it, once.
      - name: Resolve pinned toolchain
        id: rust
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' backend/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt
      - name: Check formatting
        working-directory: backend
        run: cargo fmt --package emailibrium -- --check

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Resolve pinned toolchain
        id: rust
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' backend/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Clippy
        working-directory: backend
        run: |
          cargo clippy --workspace --all-targets -- \
            -D warnings \
            -A dead_code -A unused_variables -A unused_imports -A unused_mut

  rust-test:
    name: Rust Tests
    # Opt-in bigger/native runner. Unset (the default) resolves to ubuntu-latest,
    # so this is safe everywhere; setting the repo variable to a label that does
    # not exist would queue forever, which is why it is parameterized rather than
    # hardcoded to a non-default runner.
    runs-on: ${{ vars.HEAVY_RUNNER || 'ubuntu-latest' }}
    needs: [rust-format, rust-clippy]
    # This is where the linking cost actually is: the test binaries and benches.
    # (clippy does link build scripts and proc-macros, but not the test binaries,
    # so it has little to gain.) RUSTFLAGS is scoped to this job so a missing
    # linker can never break an unrelated one.
    env:
      RUSTFLAGS: -Clink-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # Assumes an apt-based Ubuntu runner — true for ubuntu-latest and for the
      # ubuntu-*-arm images HEAVY_RUNNER is expected to point at.
      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Resolve pinned toolchain
        id: rust
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' backend/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Run tests
        working-directory: backend
        run: cargo test --workspace
      - name: Verify benchmarks compile
        working-directory: backend
        run: cargo bench --no-run

  rust-audit:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      # cargo audit only reads backend/Cargo.lock — no source code needed.
      # Do NOT fetch submodules: ruvector is a third-party submodule whose
      # availability we cannot control, and its HTTP 500s from GitHub cause
      # spurious job failures unrelated to our security posture.
      - uses: actions/checkout@v7
      # Prebuilt binary. This previously used a from-source `cargo install`,
      # which recompiled the tool on every run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fetch the RUSTSEC advisory DB with retry so a transient GitHub 500
      # does not fail the job. The audit step uses --no-fetch after this.
      - name: Fetch advisory database
        run: |
          DB="$HOME/.cargo/advisory-db"
          for attempt in 1 2 3; do
            if [ -d "$DB" ]; then
              git -C "$DB" fetch --depth=1 origin master && break
            else
              git clone --depth=1 https://github.com/RustSec/advisory-db.git "$DB" && break
            fi
            echo "Attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
      # Exceptions sourced from backend/audit-ignore (mirrors sindri pattern).
      # --no-fetch skips the network since we just fetched above.
      - name: Run cargo audit
        run: bash .github/scripts/cargo-audit.sh --no-fetch

  # Frontend jobs
  frontend-install:
    name: Frontend Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/pnpm-lock.yaml') }}

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    needs: frontend-install
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: frontend/apps/web
        run: npx tsc --noEmit
      - name: Format check
        working-directory: frontend/apps/web
        run: npx prettier --check 'src/**/*.{ts,tsx}'
      - name: Lint
        working-directory: frontend/apps/web
        run: npx eslint src/
      - name: Build
        working-directory: frontend
        run: pnpm turbo build

  # Documentation validation
  validate-markdown:
    name: Validate Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
          config: .markdownlint.yaml

  validate-yaml:
    name: Validate YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML
        run: yamllint -c .yamllint.yaml .github/ backend/ docker-compose*.yml

  validate-shell:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          set -e
          mapfile -t scripts < <(find . -name "*.sh" \
            -not -path "*/node_modules/*" \
            -not -path "*/target/*" \
            -not -path "*/ruvector/*" \
            -not -path "*/.claude/*")
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          printf 'Checking: %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"
