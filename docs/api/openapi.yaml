        acknowledgedHighRiskSeqs:
          type: array
          items: { type: integer, format: int64 }
          description: Sequence numbers of high-risk operations the user explicitly acknowledged
        acknowledgedMediumGroups:
          type: array
          items: { type: string }
          description: Group ids of medium-risk operations the user explicitly acknowledged

    ReviewedTelemetryRequest:
      type: object
      required: [event, planId, userId, timeOnReviewMs]
      description: Serialized camelCase.
      properties:
        event:
          type: string
          enum: [cleanup_plan_reviewed]
          description: Must be exactly this literal value; any other value is rejected with 400
        planId: { type: string, format: uuid }
        userId:
          {
            type: string,
            description: "Hashed server-side before any logging; never persisted in plaintext",
          }
        timeOnReviewMs: { type: integer, format: int64 }
        expandedGroups: { type: integer, format: int64, default: 0 }
        samplesViewed: { type: integer, format: int64, default: 0 }

    AccountResponse:
      type: object
      description: |
        Serialized camelCase (backend/src/api/accounts.rs::AccountResponse). Note
        `is_active` carries an explicit `#[serde(rename = "isActive")]` -- redundant
        with the struct's own camelCase rename_all, but present in the source.
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [gmail, outlook, imap] }
        emailAddress: { type: string, format: email }
        isActive: { type: boolean }
        status: { type: string }
        emailCount: { type: integer, format: int64 }
        lastSyncAt: { type: string, format: date-time, nullable: true }
        archiveStrategy: { type: string }
        labelPrefix: { type: string }
        syncDepth: { type: string }
        syncFrequency: { type: integer }

    AccountStatusResponse:
      type: object
      description: No rename_all -- backend/src/api/accounts.rs::AccountStatusResponse.
      properties:
        account_id: { type: string }
        status: { type: string }
        last_sync_at: { type: string, format: date-time, nullable: true }
        emails_synced: { type: integer, format: int64 }
        sync_failures: { type: integer }
        last_error: { type: string, nullable: true }

    UpdateAccountRequest:
      type: object
      description: Serialized camelCase. All fields optional -- only provided fields are updated.
      properties:
        archiveStrategy: { type: string, nullable: true }
        labelPrefix: { type: string, nullable: true }
        syncDepth: { type: string, nullable: true }
        syncFrequency: { type: integer, nullable: true }

    DangerZoneResponse:
      type: object
      description: Serialized camelCase.
      properties:
        messagesProcessed: { type: integer, format: int64 }
        labelsDeleted: { type: integer, format: int64 }

    ImapConnectRequest:
      type: object
      required: [email, password, imapServer, imapPort, smtpServer, smtpPort, encryption]
      description: Serialized camelCase (backend/src/api/accounts.rs::ImapConnectRequest).
      properties:
        email: { type: string, format: email }
        password:
          { type: string, description: "The provider app password, encrypted at rest on connect" }
        imapServer: { type: string, example: "imap.gmail.com" }
        imapPort: { type: integer, example: 993 }
        smtpServer: { type: string, example: "smtp.gmail.com" }
        smtpPort: { type: integer, example: 465 }
        encryption:
          type: string
          enum: [ssl, tls, none]
          description: "ssl = implicit TLS (recommended); tls = STARTTLS; none = plaintext (trusted local relays only)"

    EmailResponse:
      type: object
      description: Serialized camelCase (backend/src/api/emails.rs::EmailResponse).
      properties:
        id: { type: string }
        accountId: { type: string }
        provider: { type: string }
        messageId: { type: string, nullable: true }
        threadId: { type: string, nullable: true }
        subject: { type: string }
        fromAddr: { type: string, format: email }
        fromName: { type: string, nullable: true }
        toAddrs:
          {
            type: string,
            description: "Comma-separated addresses (stored as a single column, not an array)",
          }
        ccAddrs: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time }
        bodyText: { type: string, nullable: true }
        bodyHtml: { type: string, nullable: true }
        labels: { type: string, nullable: true, description: "Comma-separated label names" }
        isRead: { type: boolean }
        isStarred: { type: boolean }
        hasAttachments: { type: boolean }
        embeddingStatus: { type: string }
        category: { type: string }
        categoryConfidence: { type: number, nullable: true }
        folder: { type: string, nullable: true }

    ThreadResponse:
      type: object
      description: Serialized camelCase.
      properties:
        threadId: { type: string }
        emails:
          type: array
          items: { $ref: "#/components/schemas/EmailResponse" }
        subject: { type: string }
        participants:
          type: array
          items: { type: string }
        lastActivity: { type: string, format: date-time }

    AggregatedLabel:
      type: object
      description: Serialized camelCase.
      properties:
        name: { type: string, description: "Title-cased display name" }
        kind: { type: string, enum: [label] }
        isSystem: { type: boolean }
        emailCount: { type: integer, format: int64 }
        unreadCount: { type: integer, format: int64 }
        accountIds:
          type: array
          items: { type: string }

    FolderOrLabel:
      type: object
      description: backend/src/email/provider.rs::FolderOrLabel (no rename_all; kind is the MoveKind enum, camelCase-rendered "folder"/"label").
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [folder, label] }
        is_system: { type: boolean }

    EnrichedCategory:
      type: object
      description: Serialized camelCase.
      properties:
        name: { type: string }
        group: { type: string, enum: [subscription, system, category] }
        emailCount: { type: integer, format: int64 }
        unreadCount: { type: integer, format: int64 }

    EmailCounts:
      type: object
      description: Serialized camelCase.
      properties:
        total: { type: integer, format: int64 }
        unread: { type: integer, format: int64 }
        archivedCount: { type: integer, format: int64 }
        spamCount: { type: integer, format: int64 }
        trashCount: { type: integer, format: int64 }
        sentCount: { type: integer, format: int64 }
        byCategory:
          type: array
          items: { $ref: "#/components/schemas/CategoryCount" }

    CategoryCount:
      type: object
      description: Serialized camelCase.
      properties:
        category: { type: string }
        total: { type: integer, format: int64 }
        unread: { type: integer, format: int64 }

    SendEmailRequest:
      type: object
      required: [to, subject, accountId]
      description: Serialized camelCase.
      properties:
        to: { type: string, format: email }
        cc: { type: string, nullable: true }
        bcc: { type: string, nullable: true }
        subject: { type: string }
        bodyText: { type: string, nullable: true }
        bodyHtml: { type: string, nullable: true }
        accountId: { type: string }

    SendEmailResponse:
      type: object
      description: Serialized camelCase.
      properties:
        messageId: { type: string }

    MoveEmailRequest:
      type: object
      required: [accountId, targetId, kind]
      description: Serialized camelCase.
      properties:
        accountId: { type: string }
        targetId:
          {
            type: string,
            description: "Target folder name (kind=folder) or label name (kind=label)",
          }
        kind: { type: string, enum: [folder, label] }

    AttachmentResponse:
      type: object
      description: Serialized camelCase (backend/src/api/attachments.rs::AttachmentResponse).
      properties:
        id: { type: string }
        emailId: { type: string }
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        isInline: { type: boolean }
        fetchStatus: { type: string, enum: [pending, fetched, failed] }

    ModelStatus:
      type: object
      description: No rename_all -- backend/src/vectors/models.rs::ModelStatus.
      properties:
        name: { type: string, description: Model identifier }
        downloaded: { type: boolean, description: Whether the model files exist on disk }
        active: { type: boolean, description: Whether this is the currently active embedding model }
        dimensions: { type: integer, description: Output embedding dimensions }
        cache_path: { type: string, nullable: true, description: Local cache path, if downloaded }

    AiStatusResponse:
      type: object
      description: No rename_all -- backend/src/api/ai.rs::AiStatusResponse.
      properties:
        active_model: { type: string }
        dimensions: { type: integer }
        provider: { type: string }
        embedding_available: { type: boolean }
        reindex_in_progress: { type: boolean }

    ReindexStatus:
      type: object
      description: No rename_all -- backend/src/vectors/reindex.rs::ReindexStatus.
      properties:
        in_progress: { type: boolean }
        total_emails: { type: integer, format: int64 }
        stale_emails: { type: integer, format: int64 }
        reindexed_emails: { type: integer, format: int64 }
        progress_percent: { type: number, format: float }
        estimated_remaining_secs: { type: integer, format: int64, nullable: true }
        reason: { type: string, nullable: true }

    ProviderStatus:
      type: object
      description: No rename_all -- backend/src/vectors/generative_router.rs::ProviderStatus.
      properties:
        provider_type:
          type: string
          enum: [onnx, built_in, ollama, open_ai, anthropic, gemini, rule_based, open_router, none]
          description: ProviderType enum, serde(rename_all = "snake_case")
        priority: { type: integer }
        enabled: { type: boolean }
        available: { type: boolean }

    ProviderActionResponse:
      type: object
      description: No rename_all -- backend/src/api/ai.rs::ProviderActionResponse.
      properties:
        provider: { type: string }
        enabled: { type: boolean }

    ChatRequest:
      type: object
      required: [message]
      description: Serialized camelCase (backend/src/api/ai.rs::ChatRequest).
      properties:
        sessionId:
          type: string
          nullable: true
          description: Existing session to continue; a new one is created if omitted
        message:
          type: string
          example: "What meetings do I have this week?"
        history:
          description: Accepted but ignored server-side -- the backend maintains its own session history
          nullable: true

    ChatResponse:
      type: object
      description: |
        Serialized camelCase (backend/src/vectors/chat.rs::ChatResponse). The `reply`
        Rust field is itself renamed to "message" to match the frontend contract.
      properties:
        sessionId: { type: string }
        message:
          {
            type: string,
            description: The assistant's reply text (Rust field name is `reply`,
            serialized as "message"),
          }
        messageCount: { type: integer }

    ConfirmToolCallRequest:
      type: object
      required: [sessionId, confirmationId, approved]
      description: Serialized camelCase (backend/src/api/ai.rs::ConfirmToolCallRequest).
      properties:
        sessionId: { type: string }
        confirmationId: { type: string }
        approved: { type: boolean }

    ConfirmToolCallResponse:
      type: object
      description: Serialized camelCase.
      properties:
        confirmationId: { type: string }
        status: { type: string, enum: [approved, rejected] }

    SessionSummary:
      type: object
      description: Serialized camelCase (backend/src/vectors/chat.rs::SessionSummary).
      properties:
        id: { type: string }
        messageCount: { type: integer }
        createdAt: { type: string, format: date-time }
        lastActive: { type: string, format: date-time }
        contextEmailCount: { type: integer }

    DeleteSessionResponse:
      type: object
      description: No rename_all.
      properties:
        deleted: { type: boolean }
        session_id: { type: string }

    ModelCatalogEntry:
      type: object
      description: backend/src/vectors/model_catalog.rs::ModelInfo -- fields as read from config/models-llm.yaml plus computed `recommended`/`cached` flags.
      properties:
        id: { type: string }
        name: { type: string }
        params: { type: string }
        disk_mb: { type: integer }
        ram_mb: { type: integer }
        context_size: { type: integer }
        quality: { type: string }
        recommended:
          {
            type: boolean,
            description: Whether this model fits available RAM with the configured safety margin,
          }
        cached: { type: boolean }
        repo_id: { type: string }
        filename: { type: string }
        family: { type: string, nullable: true }
        chat_template: { type: string, nullable: true }
        rag_capable: { type: boolean, nullable: true }
        tool_calling: { type: boolean, nullable: true }
        default_for_ram_mb: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        cost_per_1m_input: { type: number, nullable: true }
        cost_per_1m_output: { type: number, nullable: true }

    EmbeddingCatalogEntry:
      type: object
      description: Serialized camelCase (backend/src/api/ai.rs::EmbeddingCatalogEntry).
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        dimensions: { type: integer }
        maxTokens: { type: integer }
        quality: { type: string }
        description: { type: string }
        diskMb: { type: integer, nullable: true }
        minRamMb: { type: integer, nullable: true }
        costPer1mTokens: { type: number, nullable: true }
        downloadRequired: { type: boolean }
        providerDescription: { type: string, nullable: true }
        fastembedVariant: { type: string, nullable: true }
        fastembedQuantized: { type: string, nullable: true }
        isDefault: { type: boolean }
        ollamaTag: { type: string, nullable: true }
        baseUrl: { type: string, nullable: true }
        apiKeyEnv: { type: string, nullable: true }

    SwitchModelRequest:
      type: object
      required: [modelId]
      description: Serialized camelCase.
      properties:
        modelId:
          type: string
          example: "qwen3-8b-q4km"

    SwitchModelResponse:
      type: object
      description: Serialized camelCase.
      properties:
        modelId: { type: string }
        status: { type: string, enum: [ready, downloading, error] }
        message: { type: string }

    ModelStatusResponse:
      type: object
      description: Serialized camelCase.
      properties:
        modelId: { type: string }
        status: { type: string, enum: [cached, downloading, not_cached] }
        cached: { type: boolean }

    ReembedRequest:
      type: object
      description: Serialized camelCase. Body itself is optional; omitted body defaults to mode "all".
      properties:
        mode:
          type: string
          enum: [all, failed, stale]
          default: all

    ReembedResponse:
      type: object
      description: Serialized camelCase.
      properties:
        emailsReset: { type: integer, format: int64 }
        mode: { type: string }
        message: { type: string }
        ingestionTriggered: { type: boolean }

    SemanticSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: Natural language search query
          example: "quarterly budget report"
        limit:
          type: integer
          description: Maximum number of results (default from server config)
          example: 20
        collection:
          type: string
          enum: [email_text, image_text, image_visual, attachment_text]
          description: Vector collection to search (defaults to email_text)
          example: "email_text"
        filters:
          type: object
          additionalProperties:
            type: string
          description: Metadata key-value filters
          example:
            category: "Finance"
        min_score:
          type: number
          format: float
          description: Minimum cosine similarity score (default from server config)
          example: 0.5
        mode:
          type: string
          enum: [semantic, hybrid, keyword]
          description: Search mode override. "hybrid" delegates to RRF-fused hybrid search.
          example: "semantic"

    FindSimilarRequest:
      type: object
      properties:
        limit:
          type: integer
          description: Maximum number of similar emails to return (default 10)
          example: 10

    ClassifyRequest:
      type: object
      required: [email_id, subject, from_addr, body_text]
      properties:
        email_id:
          type: string
          description: Unique identifier of the email to classify
          example: "abc-123"
        subject:
          type: string
          description: Email subject line
          example: "Q4 Budget Review"
        from_addr:
          type: string
          format: email
          description: Sender email address
          example: "finance@company.com"
        body_text:
          type: string
          description: Plain text body of the email
          example: "Please review the attached Q4 budget spreadsheet."

    ClassifyResponse:
      type: object
      properties:
        email_id:
          type: string
          description: The classified email ID
        category:
          type: string
          description: Predicted category
          enum:
            [
              Work,
              Personal,
              Finance,
              Shopping,
              Social,
              Newsletter,
              Marketing,
              Notification,
              Alerts,
              Promotions,
              Uncategorized,
            ]
        confidence:
          type: number
          format: float
          description: Confidence score (0.0 to 1.0)
        method:
          type: string
          description: Classification method used
          enum: [vector_centroid, llm_fallback]

    SearchResponse:
      type: object
      description: |
        Response fields are serialized camelCase (`#[serde(rename_all = "camelCase")]`
        on `backend/src/api/vectors.rs::SearchResponse`) -- unlike the request schema above,
        which has no rename_all and stays snake_case.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        total:
          type: integer
          description: Number of results returned
        latencyMs:
          type: integer
          format: int64
          description: Server-side search latency in milliseconds
        mode:
          type: string
          enum: [semantic, hybrid, keyword]
          description: The search mode actually used
        interactionId:
          type: string
          description: Interaction ID for click/feedback tracking (present when interaction tracking is active)

    SearchResultItem:
      type: object
      description: Serialized camelCase (see SearchResponse).
      properties:
        emailId:
          type: string
          description: Source email identifier
        score:
          type: number
          format: float
          description: Cosine similarity score (0.0 to 1.0)
        collection:
          type: string
          description: Vector collection the result belongs to
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Filterable metadata attributes
        matchType:
          type: string
          description: How this result was matched (present only for hybrid search)
        vectorRank:
          type: integer
          description: Rank in the vector search results (present only for hybrid search)
        ftsRank:
          type: integer
          description: Rank in the full-text search results (present only for hybrid search)

    HealthStatus:
      type: object
      description: Serialized camelCase (`#[serde(rename_all = "camelCase")]` on backend/src/vectors/types.rs::HealthStatus).
      properties:
        status:
          type: string
          enum: [healthy, degraded]
          description: Overall service health
        storeHealthy:
          type: boolean
          description: Whether the vector store is operational
        embeddingAvailable:
          type: boolean
          description: Whether at least one embedding provider is available
        storeStats:
          $ref: "#/components/schemas/VectorStats"

    VectorStats:
      type: object
      description: Serialized camelCase (see HealthStatus).
      properties:
        totalVectors:
          type: integer
          format: int64
          description: Total number of stored vectors
        collections:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Vector count per collection
        dimensions:
          type: integer
          description: Embedding dimensionality (e.g., 384 for MiniLM)
        memoryBytes:
          type: integer
          format: int64
          description: Estimated memory usage in bytes
        indexType:
          type: string
          description: Type of vector index in use

    StartRequest:
      type: object
      description: No rename_all -- fields are plain Rust snake_case as written.
      properties:
        account_id:
          type: string
          description: Email account identifier (defaults to "default")
        full_sync:
          type: boolean
          description: Whether to re-sync all emails (default false)
        source:
          type: string
          enum: [onboarding, manual_sync, inbox_clean, poll]
          description: Who initiated this ingestion, for attribution/telemetry

    PauseResumeRequest:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          description: Ingestion job identifier

    JobResponse:
      type: object
      properties:
        job_id:
          type: string
          description: Unique job identifier (UUID)
        status:
          type: string
          enum: [started, paused, resumed]
          description: Current job status
        message:
          type: string
          description: Human-readable status message

    IngestionProgress:
      type: object
      description: Real-time progress update for an ingestion job (emitted via SSE)
      properties:
        job_id:
          type: string
        total:
          type: integer
          format: int64
          description: Total emails to process
        processed:
          type: integer
          format: int64
          description: Emails processed so far
        embedded:
          type: integer
          format: int64
          description: Emails with generated embeddings
        categorized:
          type: integer
          format: int64
          description: Emails categorized
        failed:
          type: integer
          format: int64
          description: Emails that failed processing
        phase:
          type: string
          enum: [syncing, embedding, categorizing, clustering, analyzing, complete]
          description: Current pipeline phase
        eta_seconds:
          type: integer
          format: int64
          nullable: true
          description: Estimated seconds remaining
        emails_per_second:
          type: number
          format: double
          description: Current processing throughput

    SubscriptionInsight:
      type: object
      description: |
        Serialized camelCase (`#[serde(rename_all = "camelCase")]` on
        backend/src/vectors/insights.rs::SubscriptionInsight). `frequency` and `category`/
        `suggestedAction` are Rust enums with custom lowercase-string serialization, not the
        title-case values an earlier draft of this doc assumed.
      properties:
        senderAddress:
          type: string
          format: email
          description: Sender email address
        senderDomain:
          type: string
          description: Domain portion of the sender address
        frequency:
          type: string
          enum: [daily, weekly, biweekly, monthly, quarterly, irregular]
          description: Detected send cadence
        emailCount:
          type: integer
          format: int64
          description: Total emails received from this sender
        firstSeen:
          type: string
          format: date-time
          description: Date of the earliest email from this sender
        lastSeen:
          type: string
          format: date-time
          description: Date of the most recent email from this sender
        hasUnsubscribe:
          type: boolean
          description: Whether a List-Unsubscribe header was present on the most recent email
        category:
          type: string
          enum: [newsletter, marketing, notification, receipt, social, unknown]
          description: Subscription category
        suggestedAction:
          type: string
          enum: [keep, unsubscribe, archive, digest]
          description: Suggested next action for this subscription
        readRate:
          type: number
          format: double
          description: Estimated percentage of emails opened (0.0 to 1.0)
        listUnsubscribe:
          type: string
          nullable: true
          description: RFC 2369 List-Unsubscribe header from the most recent email, if present
        listUnsubscribePost:
          type: string
          nullable: true
          description: RFC 8058 List-Unsubscribe-Post header from the most recent email, if present

    RecurringSenderInsight:
      type: object
      description: Serialized camelCase (see SubscriptionInsight).
      properties:
        sender:
          type: string
          format: email
        emailCount:
          type: integer
          format: int64
        avgIntervalDays:
          type: number
          format: float
          description: Average days between emails
        category:
          type: string
          description: Free-text category label (not the same enum as SubscriptionInsight.category)

    InboxReport:
      type: object
      description: Serialized camelCase (see SubscriptionInsight). Has no generated_at/timestamp field.
      properties:
        totalEmails:
          type: integer
          format: int64
        categoryBreakdown:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Email count per category
        topSenders:
          type: array
          items:
            type: object
            properties:
              sender:
                type: string
              count:
                type: integer
                format: int64
        subscriptionCount:
          type: integer
          description: Number of detected subscriptions
        estimatedReadingHours:
          type: number
          format: float
          description: Estimated hours of reading time represented by the current inbox
        readRate:
          type: number
          format: double
          description: Overall read rate across all email (0.0 to 1.0)

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
