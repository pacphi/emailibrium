    WipeResponse:
      type: object
      description: |
        backend/src/api/wipe.rs::WipeResponse. `result` is `#[serde(flatten)]`, so
        WipeResult's fields (all snake_case, no rename_all on WipeResult itself)
        appear at the top level alongside `message`, not nested under a "result" key.
      properties:
        message: { type: string }
        vectors_deleted: { type: integer, format: int64 }
        backups_deleted: { type: integer, format: int64 }
        learning_records_deleted: { type: integer, format: int64 }
        interactions_deleted: { type: integer, format: int64 }
        scope:
          type: string
          enum: [user, vectors_only, all]
          description: WipeScope, serde(rename_all = "snake_case")
        user_id: { type: string, nullable: true }

    ScheduledWipe:
      type: object
      description: No rename_all -- backend/src/vectors/remote_wipe.rs::ScheduledWipe.
      properties:
        user_id: { type: string }
        scheduled_at: { type: string, format: date-time }
        execute_at: { type: string, format: date-time }
