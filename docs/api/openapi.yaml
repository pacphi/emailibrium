        type: { type: string, enum: [mailto, http_get, http_post] }
        email: { type: string, description: "mailto only" }
        subject: { type: string, nullable: true, description: "mailto only" }
        url: { type: string, description: "http_get / http_post only" }

    UnsubscribeResult:
      type: object
      description: camelCase (backend/src/email/unsubscribe.rs::UnsubscribeResult).
      properties:
        sender: { type: string }
        methodUsed:
