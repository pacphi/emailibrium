    PinResponse:
      type: object
      description: No rename_all (backend/src/api/clustering.rs::PinResponse).
      properties:
        cluster_id: { type: string }
        pinned: { type: boolean }

    RuleConditionFieldMatch:
      type: object
      description: |
        RuleCondition::FieldMatch, internally tagged (type="fieldMatch",
        rename_all=camelCase; backend/src/rules/types.rs).
      required: [type, field, operator, value]
      properties:
        type: { type: string, enum: [fieldMatch] }
        field:
          type: string
          enum: [from, to, subject, body, labels, date]
        operator:
          type: string
          enum: [contains, equals, startsWith, endsWith, regex, greaterThan, lessThan]
        value: { type: string }

    RuleConditionSemantic:
      type: object
      description: RuleCondition::Semantic (type="semantic"). threshold defaults to 0.75.
      required: [type, query]
      properties:
        type: { type: string, enum: [semantic] }
        query: { type: string }
        threshold: { type: number, format: float, default: 0.75 }

    RuleCondition:
      description: |
        Tagged union over `type` (backend/src/rules/types.rs::RuleCondition):
        fieldMatch | semantic | and | or | not. and/or wrap a `conditions` array of
        RuleCondition; not wraps a single `condition`. Documented as
        additionalProperties for the recursive combinators rather than expanding
        oneOf/recursive $ref, which most OpenAPI 3.0.3 tooling handles poorly.
      oneOf:
        - $ref: "#/components/schemas/RuleConditionFieldMatch"
        - $ref: "#/components/schemas/RuleConditionSemantic"
        - type: object
          description: 'and: { type: "and", conditions: RuleCondition[] }'
          additionalProperties: true
        - type: object
          description: 'or: { type: "or", conditions: RuleCondition[] }'
          additionalProperties: true
        - type: object
          description: 'not: { type: "not", condition: RuleCondition }'
          additionalProperties: true

    RuleAction:
      description: |
        Tagged union over `type`, camelCase (backend/src/rules/types.rs::RuleAction):
        addLabel { label }, removeLabel { label }, archive, delete { permanent?: bool
        = false }, forward { to }, markRead, markImportant.
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [addLabel, removeLabel, archive, delete, forward, markRead, markImportant]
        label: { type: string, description: "addLabel/removeLabel only" }
        permanent: { type: boolean, default: false, description: "delete only" }
        to: { type: string, description: "forward only" }

    CreateRuleRequest:
      type: object
      description: camelCase (backend/src/api/rules.rs::CreateRuleRequest).
      required: [name, actions]
      properties:
        name: { type: string }
        description: { type: string, default: "" }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/RuleCondition" }
          description: May be empty when naturalLanguage is provided instead
        actions:
          type: array
          items: { $ref: "#/components/schemas/RuleAction" }
        priority: { type: integer, default: 0 }
        enabled: { type: boolean, default: true }
        naturalLanguage:
          type: string
          nullable: true
          description: Parsed via json_parser::parse_natural_language and prepended to conditions

    UpdateRuleRequest:
      type: object
      description: camelCase (backend/src/api/rules.rs::UpdateRuleRequest). Every field optional -- only present fields are applied.
      properties:
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/RuleCondition" }
          nullable: true
        actions:
          type: array
          items: { $ref: "#/components/schemas/RuleAction" }
          nullable: true
