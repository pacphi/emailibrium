  plan:    ""
  adr_dir: "docs/ADRs"
  ddd_dir: "docs/DDDs"
  extra:   []

# Branch model. trunk is NEVER merged autonomously — a human always merges the final PR.
# Revised 2026-07-31 (user request): each phase branches off `develop`, PRs into `develop`, and
# auto-merges once CI is green. When every phase has landed, orchestrate opens ONE `develop -> main`
# PR and STOPS — that PR is where a human reviews the full body of work from all phases before it
# ever reaches `main`. `develop` did not exist as a branch before this pipeline; orchestrate's STEP A
# creates it from `main` (locally + pushed to origin) idempotently on its first firing — nothing to
# do here. .github/workflows/ci.yml's `pull_request.branches` was widened to `[main, develop]` in the
# same sitting (2026-07-31) so phase PRs into `develop` actually get CI-checked — without that, every
# phase PR would show zero checks and orchestrate's anti-vacuous-green guard would refuse to merge.
trunk: main
base:  develop

# Autonomy mode: pr_ci — branch -> PR -> CI -> bounded fix-loop -> squash-merge, no per-phase
# human checkpoint. NOTE: OPTIMIZATION_SPEC.md's own preamble recommends `reviewed` for the first
# run on this pipeline; the user explicitly chose pr_ci instead when confirming this plan
# (2026-07-31). CI covers PRs into base `develop` (see branch-model note above; profile.yml
# ci.base_coverage: covered), and qe-court (accelerators.qe_court, 3 vendors) will convene on
# risk_phases and the final develop->main integration PR as an extra adversarial check given
# there's no human checkpoint per phase.
autonomy: pr_ci

fix_budget: 5

max_parallel: 1
requeue_budget: 2

# F-5 (nextest archive restructuring), F-2 (Docker build context/submodules), and F-1 (Docker
# publish stage) carry real blast radius (release artifact correctness, CI restructuring) — see
# OPTIMIZATION_SPEC.md's own risk_phases: [F-5, F-2, F-1].
risk_phases: [4, 5, 6]

court: auto

