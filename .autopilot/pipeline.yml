feature_id: "ci-build-optimization"
goal: "Fix the broken Docker publish (wrong build stage + missing submodule context) and optimize the CI/build/dependency pipeline per the rust-optimizer audit in OPTIMIZATION_SPEC.md."
spec: "OPTIMIZATION_SPEC.md"

references:
