# pipeline.yml — QUEUED plan, parked by autopilot:plan on 2026-08-01.
#
# NOT ACTIVE. `docs-accuracy-audit` is still in flight, and there is only ever ONE active
# .autopilot/pipeline.yml. This file lives in the git-ignored .autopilot/queued/ dir until a
# human promotes it (mv into place + seed ledger record 0 + commit — see the autopilot
# plugin's docs/lifecycle.md).
#
# This pipeline's footprint (frontend/apps/web/src/**, docs/user-guide.md) is disjoint from
# both docs-accuracy-audit's remaining phases and the queued postgres-support pipeline
# (backend/**, CI, deployment/config docs), so ordering between the two queued plans doesn't
# matter — promote whichever the user wants to run first.

feature_id: "keyboard-shortcuts"
goal: "Implement, test, and ship the keyboard shortcuts that docs-accuracy-audit phase 1 removed from docs.md as aspirational-but-unbuilt, alongside the shortcuts already implemented and documented, as one reconciled set."
spec: |
  Motivating evidence gathered while scoping (2026-08-01):

    * The docs-accuracy-audit pipeline's phase 1 diff to docs/user-guide.md (or
      docs/user-interface-overview.md) removed a Keyboard Shortcuts table row set that did not
      match any real implementation: `C` (compose), `R` (reply), `F` (forward), `E` (archive),
      `#` (delete), `J`/`K` (next/prev in list — since superseded by arrow-key nav), `Cmd+Shift+A`
      (select all), `Cmd+,` (open settings), `?` (show shortcut help). What survived the
      correction — because it's real — is `Cmd+K` (command palette), `Escape`, `↓`/`↑` (list
      nav), `Cmd+Enter` (send reply), `Enter`/`Shift+Enter` (chat box). The corrected doc now
      states explicitly: "Other actions (compose, reply, forward, archive, delete, search focus,
      select-all, open settings) are click/tap-only today — there is no keyboard shortcut for
      them yet."
    * `frontend/apps/web/src/shared/hooks/useKeyboard.ts` already exists: a complete,
      well-designed shortcut-registration hook (`ShortcutMap` — string like `"cmd+shift+p"` to
      handler; auto preventDefault/stopPropagation; skips non-modifier shortcuts while an
      input/textarea/contenteditable is focused). It is exported from the shared hooks barrel
      (`apps/web/src/shared/hooks/index.ts`, `apps/web/src/shared/index.ts`) but has **zero call
      sites** anywhere in the app and zero test coverage — built, then apparently never wired up,
      which is likely exactly how the doc drifted ahead of the implementation in the first place.
    * The two shortcuts that DO work today are wired ad hoc, not through that hook:
      `apps/web/src/features/command-center/hooks/useCommandPalette.ts` has its own raw
      `document.addEventListener('keydown', ...)` checking `(event.metaKey || event.ctrlKey) &&
      event.key === 'k'`; `apps/web/src/features/email/EmailList.tsx` has a local
      `React.KeyboardEvent` handler for list navigation. Neither goes through useKeyboard.
    * Relevant existing feature surfaces the new shortcuts need to call into:
      apps/web/src/features/email/ComposeEmail.tsx (compose), ReplyBox.tsx (reply),
      EmailList.tsx (archive/delete/select-all state), MoveDialog.tsx.

  Scope: implement the 8 removed-from-docs shortcuts for real (C, R, F, E, #, Cmd+Shift+A,
  Cmd+,, ?) — J/K is intentionally NOT restored, since arrow-key nav already superseded it and
  restoring a second nav binding would be a regression, not parity. Consolidate the 2 already-
  working shortcuts onto the same useKeyboard registry so there is one dispatch mechanism and
  one source of truth for the docs table going forward, instead of two ad hoc listeners plus a
  new one for each addition.

references:
  prd:     ""
  plan:    ""
  adr_dir: "docs/ADRs"
  ddd_dir: "docs/DDDs"
  extra:   ["docs/user-guide.md"]

trunk: main
base:  develop

autonomy: pr_ci

fix_budget: 5
max_parallel: 1
requeue_budget: 2

# Plain UI feature work — no auth/merge/security logic, no generated-edit execution. Every
# phase still gets the mandatory Tier-3 adversarial review regardless of this list being empty.
risk_phases: []

court: auto

phases:
  - id: 0
    goal: "One shortcut-dispatch mechanism exists and is proven: useKeyboard is wired into the app shell, both currently-working shortcuts are migrated onto it with no behavior change, and the hook itself finally has test coverage."
    track: "keyboard-shortcuts"
    deliverables:
      - "useKeyboard mounted once at the app-shell/layout level as the single global shortcut registry (not per-feature ad hoc listeners)."
      - "Cmd+K (apps/web/src/features/command-center/hooks/useCommandPalette.ts) migrated from its raw document listener onto the registry."
      - "↓/↑ list navigation (apps/web/src/features/email/EmailList.tsx) migrated onto the registry where feasible without breaking list-item-focus semantics."
      - "apps/web/src/shared/hooks/useKeyboard.test.ts — first-ever test coverage for the hook (modifier matching, editable-field guard, cleanup on unmount)."
    definition_of_done:
      - "cmd: pnpm --filter web test -- useKeyboard passes"
      - "cmd: pnpm --filter web test passes (full suite — existing Cmd+K and list-nav behavior tests, if any, still pass unchanged)"
      - "cmd: pnpm --filter web typecheck passes"
      - "prose: apps/web/src/features/command-center/hooks/useCommandPalette.ts no longer contains its own document.addEventListener('keydown', ...) block"
    conventions: "Match apps/web/src/shared/hooks/useKeyboard.ts's existing JSDoc and ShortcutMap conventions; follow the repo's existing Vitest + Testing Library patterns for hook tests."
    depends_on: []
    touches: ["frontend/apps/web/src/shared/hooks/**", "frontend/apps/web/src/features/command-center/**", "frontend/apps/web/src/features/email/EmailList.tsx"]
    adrs: []
    ddd: []

  - id: 1
    goal: "C, R, and F work: compose, reply, and forward are keyboard-accessible."
    track: "keyboard-shortcuts"
    deliverables:
      - "`C` opens compose (global, not scoped to a focused email) — wires into ComposeEmail.tsx's existing open path."
      - "`R` opens reply on the currently focused/open email — wires into ReplyBox.tsx."
      - "`F` opens forward on the currently focused/open email."
    definition_of_done:
      - "cmd: pnpm --filter web test passes, including new tests asserting each of C/R/F triggers its action and is a no-op with nothing focused where that applies"
      - "cmd: pnpm --filter web typecheck passes"
      - "prose: all three are registered through the phase-0 useKeyboard instance, not a new ad hoc listener"
    conventions: "Reuse the existing compose/reply/forward trigger functions already called by the click-driven UI — the shortcut is a second entry point into the same action, not a new implementation of it."
    depends_on: [0]
    touches: ["frontend/apps/web/src/features/email/**", "frontend/apps/web/src/features/chat/**"]
    adrs: []
    ddd: []

  - id: 2
    goal: "E, #, and Cmd+Shift+A work: archive, delete, and select-all are keyboard-accessible."
    track: "keyboard-shortcuts"
    deliverables:
      - "`E` archives the currently focused email."
      - "`#` deletes the currently focused email."
      - "`Cmd+Shift+A` selects all emails in the current view."
    definition_of_done:
      - "cmd: pnpm --filter web test passes, including new tests asserting archive/delete fire the same mutation the click UI fires, and select-all selects every currently-visible row"
      - "cmd: pnpm --filter web typecheck passes"
    conventions: "Reuse EmailList.tsx's existing archive/delete/select-all handlers — same pattern as phase 1."
    depends_on: [0]
    touches: ["frontend/apps/web/src/features/email/**"]
    adrs: []
    ddd: []

  - id: 3
    goal: "Cmd+, and ? work: settings is keyboard-accessible, and a help surface documents the live shortcut set."
    track: "keyboard-shortcuts"
    deliverables:
      - "`Cmd+,` opens/navigates to settings."
      - "`?` opens a keyboard-shortcut help panel/modal that enumerates the full live set (ideally rendered FROM the useKeyboard registry's own shortcut map, so it can't drift from reality the way the docs table did)."
    definition_of_done:
      - "cmd: pnpm --filter web test passes, including new tests asserting Cmd+, navigates to settings and ? opens the help surface"
      - "cmd: pnpm --filter web typecheck passes"
      - "prose: the help panel's shortcut list is sourced from the same registry the hook dispatches from, not a hand-maintained duplicate"
    conventions: "New help component should match the existing CommandPalette.tsx's modal/overlay styling conventions."
    depends_on: [0]
    touches: ["frontend/apps/web/src/features/command-center/**"]
    adrs: []
    ddd: []

  - id: 4
    goal: "docs/user-guide.md's Keyboard Shortcuts table is complete and accurate again — this time verifiably, not just by inspection."
    track: "docs"
    deliverables:
      - "docs/user-guide.md Keyboard Shortcuts table rewritten to list the full reconciled set: the pre-existing Cmd+K/Escape/↓↑/Cmd+Enter/Enter/Shift+Enter rows plus the 7 newly-real rows from phases 1-3 (C, R, F, E, #, Cmd+Shift+A, Cmd+,, ?) — J/K deliberately omitted (superseded by arrow nav, not restored)."
      - "A small verification script (in the spirit of docs-accuracy-audit's scripts/audit/extract-routes.sh) comparing the runtime shortcut registry's keys against the doc table, so this table can be checked instead of trusted."
    definition_of_done:
      - "prose: every shortcut key present in the phase-0..3 useKeyboard registrations has a corresponding row in docs/user-guide.md's table, and vice versa — verified by the verification script's output, not by eye"
      - "cmd: just lint (or the docs-only subset: markdownlint) passes"
      - "grep:absent: click/tap-only today in the Keyboard Shortcuts section of docs/user-guide.md (the caveat this pipeline makes obsolete)"
    conventions: "Match the existing table formatting docs-accuracy-audit's phase 1 already established in this file."
    depends_on: [1, 2, 3]
    touches: ["docs/user-guide.md", "scripts/audit/**"]
    adrs: []
    ddd: []
