# pipeline.yml — ACTIVE plan, promoted 2026-08-03.
#
# Promoted from .autopilot/queued/postgres-support.pipeline.yml (parked 2026-08-01, behind
# docs-accuracy-audit and keyboard-shortcuts, both now shipped). Re-planned in place the same
# day per the user's added requirement: both SQLite and PostgreSQL must stay conveniently
# selectable across every mode the app is deployed/run in (native `just dev`/`dev-llm`,
# `just docker-up-dev`, `just docker-up`) — not just "Postgres works if you know the right
# env var." This folded new deliverables/DoD into phases 0, 3, and 4 (see their comments below)
# rather than adding a phase — it is the same coherent concern (dual-backend support), just
# with "convenient" made a checkable property instead of an implicit assumption.
#
# RE-PLAN 2 (2026-08-03, mid-phase-2, per ADR-036): the call-site migration pivots from the
# hand-rolled Database-enum dispatch (ADR-035 strategy) to SeaORM 2.0 as the dialect layer.
# Trigger: 15 of the (revised) 51 files in, four additional dialect-divergence classes had
# surfaced (ADR-035 §2.5–§2.7), each needing more custom per-backend code — the user directed
# complete minimization of custom dialect code, a spike (recorded in ADR-036 §3) passed 11/11
# checks against both live backends, and the pipeline was re-decomposed: phase 2 becomes the
# SeaORM foundation + exemplar ports, a new phase 3 carries the full port, and the old phases
# 3/4/5 renumber to 4/5/6 with bodies unchanged. Phases 0/1 keep their gate-PASSED markers.
# Phase 2's in-flight branch (autopilot/postgres-support/phase-2, 11 wip commits of hand-rolled
# conversion + real bug fixes) is the STARTING POINT for the re-planned phase 2, not discarded —
# the enum and DatabaseConnection coexist during the port. Schema modernization (TIMESTAMPTZ
# normalization, JSON-array→join-table, sea-orm-migration for future migrations) is queued
# separately as .autopilot/queued/db-schema-modernization.pipeline.yml — separable,
# data-migration-sensitive, not required for this pipeline's goal.

feature_id: "postgres-support"
goal: "Make PostgreSQL a real, working, CI-verified second database backend — not just a docker-compose service and an aspirational doc claim."
spec: |
  Motivating evidence gathered while scoping (2026-08-01):

    * `backend/Cargo.toml` line 37 enables sqlx features `["runtime-tokio", "sqlite", "chrono",
      "uuid"]` — no `postgres` feature. `backend/src/db/mod.rs` is built directly on
      `sqlx::sqlite::{SqlitePool, SqlitePoolOptions}`; `Database::connect` unconditionally
      opens a SQLite pool regardless of the URL scheme passed in.
    * `docker-compose.yml` (lines 124+) runs a `postgres:16-alpine` service unconditionally
      alongside the backend, and the backend's `depends_on: postgres: condition:
      service_healthy` — the service is live infrastructure the backend never actually talks
      to.
    * `.github/workflows/smoke.yml` line 51 writes a `postgres://emailibrium:...@postgres:5432/
      emailibrium` value into the `database_url` secret file — apparently intending to smoke-
      test against Postgres. It never reaches the app: `backend/entrypoint.sh` resolves
      `/run/secrets/database_url` into the env var `DATABASE_URL` (uppercased basename, no
      prefix), but `backend/src/vectors/config.rs` line 102 loads config via
      `Env::prefixed("EMAILIBRIUM_")` — so the app only ever reads `EMAILIBRIUM_DATABASE_URL`
      and silently falls back to the config default `sqlite:emailibrium.db?mode=rwc`
      (`backend/config.yaml` line 10). The smoke test has been exercising SQLite the entire
      time, believing it was testing Postgres.
    * 22 files under `backend/src/` reference `SqlitePool` directly (`grep -rl SqlitePool
      backend/src | wc -l`) — the call-site surface that needs to work against either backend.
    * 29 migrations exist (`backend/migrations/001..029`); 6 use SQLite-only syntax
      (`AUTOINCREMENT`, `PRAGMA`, etc. — `grep -rli 'AUTOINCREMENT|PRAGMA|INTEGER PRIMARY
      KEY|json_extract|strftime' backend/migrations`) that has no direct Postgres equivalent
      and needs porting.
    * Zero `sqlx::query!`/`sqlx::query_as!` compile-time-checked macro usages exist in
      `backend/src` (`grep -rn 'sqlx::query!\|sqlx::query_as!' backend/src | wc -l` = 0) — all
      queries are the runtime `query`/`query_as` + `.bind(...)` form, which is materially
      easier to make backend-agnostic than compile-time-checked SQL would have been.
    * This was surfaced because `docs/deployment-guide.md`'s Database Strategy section
      (corrected under the `docs-accuracy-audit` pipeline, phase 2) now accurately says
      PostgreSQL is "planned, not implemented" — which read as new/wrong to the user because
      they believed production Postgres support already existed. This pipeline makes that
      belief true instead of correcting the doc a second time.

  Non-goals: no new database features, no change to the SQLite happy path's behavior or
  performance. This is additive backend capability, gated by URL scheme (`postgres://` vs
  `sqlite:`), landing alongside the existing default.

  [RE-PLAN 2 amendment] The original "no ORM swap" non-goal was written when the call-site
  surface was estimated at 22 files and zero divergence classes were catalogued. With the
  real surface at 51 files and nine classes (ADR-035), the hand-rolled strategy's custom-code
  cost inverted the tradeoff; ADR-036 records the decision and spike evidence for adopting
  SeaORM 2.0 as the dialect layer. URL-scheme selection (ADR-033) is unchanged. Schema
  changes remain a non-goal here (queued: db-schema-modernization).

references:
  prd: ""
  plan: ""
  adr_dir: "docs/ADRs"
  ddd_dir: "docs/DDDs"
  extra: ["docker-compose.yml", ".github/workflows/smoke.yml"]

trunk: main
base: develop

autonomy: pr_ci

fix_budget: 5
max_parallel: 1
requeue_budget: 2

# 2 (introduces the SeaORM dialect layer at the architecture's core — foundational change),
# 3 (the full port touches ~51 files across the whole backend — widest blast radius in the
# pipeline), 4 (CI + entrypoint secret-plumbing change — merge-adjacent, and the exact class
# of "green build, broken runtime" gap the smoke.yml workflow itself was built to catch, per
# its own header comment), and 6 (adopts a new compiled Postgres extension (ruvector-postgres)
# plus hand-written term/document-frequency maintenance queries feeding a SQL scoring
# function — new attack surface + new place to get query construction wrong, per ADR-034).
risk_phases: [2, 3, 4, 6]

court: auto

phases:
  - id: 0
    goal: "A Postgres-capable connection layer exists behind a backend-selecting abstraction, with the design decision recorded as an ADR, and the SQLite path is provably unchanged."
    track: "database"
    deliverables:
      - "sqlx `postgres` feature enabled in backend/Cargo.toml alongside the existing `sqlite` feature."
      - "A `Database` abstraction in backend/src/db/mod.rs (enum-of-pools or trait object) whose `connect(url)` picks Sqlite vs Postgres by URL scheme, replacing the current unconditional `SqlitePoolOptions` call."
      - "docs/ADRs/ADR-033-postgresql-backend-support.md recording the dual-backend decision: why URL-scheme dispatch, why runtime (not compile-time-checked) queries, what stays SQLite-only (if anything)."
      - "backend/config.yaml's `database_url` key gains an inline comment documenting BOTH accepted URL schemes (`sqlite:...` and `postgres://...`) as the single, single-variable point of backend selection — mirroring how the adjacent `store.backend` key already documents its own valid values (`ruvector | memory | qdrant | sqlite`) inline. No separate feature flag/enum for the database backend; the URL scheme IS the selector, and that convention must be self-evident from reading the config file, not just the ADR."
    definition_of_done:
      - "cmd: cd backend && cargo build --features vectors passes with the postgres feature enabled"
      - "cmd: cd backend && cargo test passes (existing SQLite-path tests unaffected)"
      - "grep: postgres in backend/Cargo.toml (the sqlx features line)"
      - "grep: postgres:// in backend/config.yaml (the documented example URL, alongside the existing sqlite: default)"
      - "prose: backend/src/db/mod.rs no longer imports sqlx::sqlite::{SqlitePool, SqlitePoolOptions} directly at the connect() call site — it goes through the new abstraction"
      - "prose: docs/ADRs/ADR-033-postgresql-backend-support.md exists and documents the URL-scheme dispatch decision, and explicitly states that it is the ONE mechanism used to select a backend across every deploy/run mode (native, docker dev, docker prod) — later phases must not invent a second, mode-specific selection mechanism"
    conventions: "Match backend/src/db/mod.rs's existing doc-comment style (see the audited_sql() block); keep the abstraction minimal — this phase is plumbing, not the migration of the 22 call sites (that's phase 2). Match config.yaml's existing inline-comment style for enumerating valid values (see the `store.backend` line)."
    depends_on: []
    touches:
      [
        "backend/Cargo.toml",
        "backend/src/db/mod.rs",
        "backend/config.yaml",
        "docs/ADRs/ADR-033-postgresql-backend-support.md",
      ]
    adrs: []
    ddd: []

  - id: 1
    goal: "All migrations except the 3 FTS5-only ones run clean against a real PostgreSQL 16 instance, via parallel per-backend migration directories, producing a relationally-equivalent schema. Full-text search parity is explicitly out of scope here (ADR-034 — lands in phase 3)."
    track: "database"
    deliverables:
      - "backend/migrations/ split into backend/migrations/sqlite/ (the existing 29 files, moved verbatim — zero content change) and backend/migrations/postgres/ (26 files: every migration except 005_fts5_search.sql, 019_fts5_add_from_name.sql, 020_fts5_bm25_weights.sql, ported to Postgres dialect: AUTOINCREMENT -> GENERATED ALWAYS AS IDENTITY, BLOB -> BYTEA, DATETIME -> TIMESTAMPTZ, datetime('now') -> now(), same numbering/filenames as their sqlite/ counterparts)."
      - "Database::run_migrations() (backend/src/db/mod.rs) picks the correct migrations directory (two separate sqlx::migrate! embedded migrators, one per backend) based on the connected variant."
      - "ADR-034 (already written) is referenced at the call site explaining why Postgres has no FTS-equivalent migrations yet."
    definition_of_done:
      - "cmd: a throwaway postgres:16-alpine container (docker run) accepts `sqlx::migrate!` cleanly end to end for all 26 Postgres-targeted migrations"
      - "grep:absent: AUTOINCREMENT|BLOB\\b|\\bDATETIME\\b in backend/migrations/postgres/**/*.sql"
      - "cmd: cd backend && cargo test db:: passes"
      - "cmd: cd backend && cargo build --features vectors passes (both migrators compile in)"
      - "prose: the migration-set-selection logic is documented at the call site in backend/src/db/mod.rs, citing ADR-034 for the FTS exclusion"
    conventions: "Follow the existing migrations/ numbering and header-comment conventions (see 028_imap_accounts.sql for the current house style). Postgres files keep the same filename/number as their sqlite/ counterpart so the two directories stay easy to diff side by side."
    depends_on: [0]
    touches: ["backend/migrations/**", "backend/src/db/mod.rs"]
    adrs: ["ADR-033-postgresql-backend-support", "ADR-034-postgresql-fulltext-search-ruvector-bm25"]
    ddd: []

  # RE-PLAN 2: phase 2 rewritten from "hand-rolled call-site migration" to "SeaORM foundation".
  # Continues on the existing in-flight branch autopilot/postgres-support/phase-2 (11 wip
  # commits of hand-rolled conversion stay — they compile, test green, and fixed real bugs;
  # the enum and DatabaseConnection coexist until phase 3 finishes the port).
  - id: 2
    goal: "SeaORM 2.0 is wired in as the dialect layer (ADR-036) and proven in-tree: entities for the cleanup domain, DatabaseConnection available app-wide alongside the legacy Database enum, and the two hardest already-hand-converted repositories re-ported to SeaORM as the exemplar pattern every phase-3 port follows."
    track: "database"
    deliverables:
      - "sea-orm 2.0 moved from dev-dependencies to dependencies in backend/Cargo.toml, features trimmed to what is used (sqlx-sqlite, sqlx-postgres, runtime-tokio, with-chrono, with-uuid, macros; no arrow)."
      - "docs/ADRs/ADR-036-seaorm-dialect-layer.md committed (decision + spike evidence); ADR-035 status updated to superseded-as-strategy/retained-as-catalog."
      - "backend/src/db/entities/ module: SeaORM entities for the cleanup-domain tables (cleanup_plans, cleanup_plan_account_etags, cleanup_plan_operations, cleanup_apply_jobs), types matching the migration DDL exactly (i32 for INT4, Vec<u8> for BLOB/BYTEA, per-column temporal types per ADR-035's catalog)."
      - "Database gains an into_sea_orm()/sea_orm() accessor producing a shared sea_orm::DatabaseConnection wrapping the SAME underlying pool (SqlxSqliteConnector/SqlxPostgresConnector, per spike Q2); AppState carries it alongside the legacy enum during the transition."
      - "cleanup/repository/plan_repo.rs and cleanup/repository/job_repo.rs re-ported from hand-rolled match-dispatch to SeaORM (upserts via OnConflict, transactions via TransactionTrait, json_set call sites become read-modify-write per ADR-036 §2.4) — the exemplar PRs phase 3 mimics."
      - "backend/examples/spike_seaorm.rs deleted (its content graduated into the real port; ADR-036 §3 records its results)."
    definition_of_done:
      - "cmd: cd backend && cargo build --features vectors passes"
      - "cmd: cd backend && cargo test passes"
      - "cmd: cd backend && cargo clippy --all-targets --features vectors -- -D warnings passes"
      - "cmd: cargo tree -e no-build --prefix none | grep -E '^sqlx v' | sort -u prints exactly one version line (no dual sqlx stack)"
      - "grep: sea-orm in backend/Cargo.toml's [dependencies] section (not only dev-dependencies)"
      - "grep:absent: json_set|jsonb_set in backend/src/cleanup/repository/plan_repo.rs"
      - "prose: plan_repo.rs and job_repo.rs contain no per-backend match on Database variants — their bodies are single-code-path SeaORM, verified against a live postgres:16-alpine container (documented reproduction command in the PR)"
      - "prose: ADR-036 exists, records the 11-point spike table, and names the raw-escape-hatch policy phase 6 will use"
    conventions: "Entity modules follow the spike's structure (partial models over existing tables; empty Relation enums until needed). Repository trait signatures do NOT change — only bodies. Keep the legacy enum working untouched for every not-yet-ported file."
    depends_on: [0, 1]
    touches:
      [
        "backend/Cargo.toml",
        "backend/src/db/**",
        "backend/src/cleanup/repository/**",
        "backend/src/main.rs",
        "docs/ADRs/ADR-036-seaorm-dialect-layer.md",
        "docs/ADRs/ADR-035-postgresql-call-site-migration-placeholder-translation.md",
      ]
    adrs:
      [
        "ADR-033-postgresql-backend-support",
        "ADR-035-postgresql-call-site-migration-placeholder-translation",
        "ADR-036-seaorm-dialect-layer",
      ]
    ddd: []

  - id: 3
    goal: "Every remaining backend call site talks to the database through SeaORM's single code path — the hand-rolled dispatch (per-backend match arms, Database::adapt(), audited_sql() wrapping, the pool() bridge) is deleted, not merely bypassed."
    track: "database"
    deliverables:
      - "All remaining files using SqlitePool, .pool(), Database::adapt(), or per-backend match dispatch ported to SeaORM entities/queries (entities added per table as each file ports), including the 13 files hand-converted before RE-PLAN 2 (their width/temporal bug fixes carry into entity definitions)."
      - "backend/src/db/mod.rs shrunk to: URL-scheme connect (ADR-033), run_migrations, the sea_orm() accessor, and nothing else — adapt(), audited_sql(), sqlite_placeholders_to_postgres(), and pool() deleted with their unit tests."
      - "Raw-SQL escape hatches (ADR-036 policy) only where ADR-035's catalog proves them irreducible (e.g. AVG casts), each carrying a comment citing the catalog section."
    definition_of_done:
      - "cmd: cd backend && cargo build --features vectors passes"
      - "cmd: cd backend && cargo test passes"
      - "cmd: cd backend && cargo clippy --all-targets --features vectors -- -D warnings passes"
      - "grep:absent: SqlitePool in backend/src (outside backend/src/db/mod.rs's connect internals)"
      - "grep:absent: Database::adapt|audited_sql|sqlite_placeholders_to_postgres in backend/src"
      - "grep:absent: \\.pool\\(\\) in backend/src"
      - "prose: at least the repository-layer ports are verified against a live postgres:16-alpine container (documented reproduction command in the PR)"
    conventions: "File-by-file, mimicking phase 2's exemplar ports exactly. Repository/service public signatures unchanged. Any file whose queries are genuinely irreducible per-backend gets the escape hatch, never a revived match-dispatch."
    depends_on: [2]
    touches: ["backend/src/**/*.rs"]
    adrs:
      [
        "ADR-035-postgresql-call-site-migration-placeholder-translation",
        "ADR-036-seaorm-dialect-layer",
      ]
    ddd: []

  # RE-PLAN 2: renumbered 3 -> 4 (body unchanged).
  - id: 4
    goal: "CI actually proves PostgreSQL works, and choosing SQLite vs PostgreSQL is a one-flag decision in every deploy/run mode — not just something that works if you already know the right env var."
    track: "ci"
    deliverables:
      - "backend/entrypoint.sh (or the compose secret name) fixed so the postgres:// URL smoke.yml already writes actually reaches EMAILIBRIUM_DATABASE_URL."
      - "A new job in .github/workflows/ci.yml running the backend test suite against a live postgres:16-alpine service container (mirroring the sqlite-path job)."
      - "smoke.yml updated/verified to assert it is genuinely exercising Postgres post-fix (e.g. a diagnostic log line or health-endpoint field naming the active backend)."
      - 'docker-compose.yml''s `postgres` service gated behind a compose profile (`profiles: ["postgres"]`), mirroring the existing `qdrant` service''s opt-in pattern (same file, ~line 204) — so `docker compose up` (no profile) is a valid, fully-working SQLite-only deployment that never has to pull/start/health-check a Postgres container it won''t use. The backend service''s `depends_on: postgres: condition: service_healthy` is adjusted (e.g. moved to a profile-scoped override, or made conditional per whatever mechanism the phase''s own research into current Compose profile+depends_on semantics confirms actually works — verify empirically, do not assume) so backend still starts cleanly with no profile active.'
      - "docker-compose.yml (or docker-compose.dev.yml) documents, at the point of use, the one env var / profile flag that switches a docker deployment from SQLite to Postgres — e.g. a header comment on the `postgres` service and/or the `backend.environment` block, not just prose in a separate doc file."
      - "justfile's `docker-up` / `docker-up-dev` recipe help text (the `help` recipe's printed Quick Start / Deploy sections) names the exact toggle for running each mode against Postgres instead of the SQLite default, so the answer is visible from `just` / `just --list` itself."
    definition_of_done:
      - "cmd: cd backend && EMAILIBRIUM_DATABASE_URL=postgres://... cargo test passes locally against a throwaway postgres container (documented reproduction command)"
      - "grep: EMAILIBRIUM_DATABASE_URL in backend/entrypoint.sh (or wherever the fix lands)"
      - "prose: .github/workflows/ci.yml contains a postgres service-container job running the backend suite"
      - "prose: the CI job referenced above is green on the phase's own PR (remote CI is the authority per orchestrate's invariants — this line is verified by the gate reading real check results, not asserted)"
      - "cmd: docker compose config succeeds with no profile flags and does not include the postgres service"
      - "cmd: docker compose --profile postgres config succeeds and includes the postgres service, wired the same way it is today"
      - "prose: justfile's help text (or the docker-up/docker-up-dev recipe comments) documents the SQLite-vs-Postgres toggle for docker deployments"
    conventions: "Match ci.yml's existing job structure and docker.yml/smoke.yml's service-container + healthcheck conventions. Match the qdrant service's existing `profiles:` pattern exactly (docker-compose.yml ~line 200-223) rather than inventing a new opt-in mechanism."
    depends_on: [1, 3]
    touches:
      [
        ".github/workflows/ci.yml",
        ".github/workflows/smoke.yml",
        "backend/entrypoint.sh",
        "docker-compose.yml",
        "docker-compose.dev.yml",
        "justfile",
      ]
    adrs: ["ADR-033-postgresql-backend-support"]
    ddd: []

  # RE-PLAN 2: renumbered 4 -> 5 (body unchanged).
  - id: 5
    goal: "The operator docs describe PostgreSQL support accurately now that it's real, closing the loop the docs-accuracy-audit pipeline opened, and every deploy/run mode has an explicit, findable answer for 'how do I use Postgres here instead of SQLite.'"
    track: "docs"
    deliverables:
      - "docs/deployment-guide.md Database Strategy section rewritten: remove the 'SQLite is currently the only database...' language, document real Postgres setup + the actual multi-user/HA guidance now that it applies."
      - "docs/deployment-guide.md gains a per-mode subsection or table covering all four ways emailibrium is actually run — native (`just dev` / `just dev-llm`), `just docker-up-dev`, and `just docker-up` — each row/entry stating the exact one-line toggle (the `EMAILIBRIUM_DATABASE_URL` value and/or the compose `--profile postgres` flag from phase 3) to run that mode against SQLite vs PostgreSQL. This is the single place a user checks instead of re-deriving it from config.yaml + docker-compose.yml + the ADR."
      - "docs/configuration-reference.md's EMAILIBRIUM_DATABASE_URL entry updated with a working postgres:// example."
      - "docs/deployment-guide.md's Postgres section explicitly notes the interim full-text-search gap (no keyword search on Postgres until phase 5 ships ruvector-postgres BM25 — semantic/vector search is unaffected), citing ADR-034, so this is a documented tradeoff rather than a surprise a user discovers themselves."
    definition_of_done:
      - "grep:absent: planned, not implemented in docs/deployment-guide.md (the specific phrase this pipeline makes obsolete)"
      - "cmd: just lint (or the docs-only subset: markdownlint + lychee) passes"
      - "prose: docs/deployment-guide.md's Database Strategy table reflects PostgreSQL as an available option with accurate operational notes"
      - "prose: docs/deployment-guide.md explicitly documents the SQLite-vs-Postgres toggle for each of native dev, docker dev, and docker prod modes, consistent with what phase 3 actually shipped (not a generic restatement of the ADR)"
      - "prose: docs/deployment-guide.md documents the full-text-search gap on Postgres until phase 5, citing ADR-034"
    conventions: "Match docs-accuracy-audit's phase-2 prose style in these same two files — this phase is a direct continuation of that edit, now describing working code instead of documenting its absence."
    depends_on: [4]
    touches: ["docs/deployment-guide.md", "docs/configuration-reference.md"]
    adrs: ["ADR-033-postgresql-backend-support", "ADR-034-postgresql-fulltext-search-ruvector-bm25"]
    ddd: []

  # RE-PLAN 2: renumbered 5 -> 6; body unchanged except the conventions line now names the
  # ADR-036 escape-hatch pattern (spike Q10) as the sanctioned mechanism for the per-backend
  # keyword-scoring queries.
  - id: 6
    goal: "PostgreSQL full-text search reaches real BM25 parity with SQLite FTS5 via ruvector-postgres, per ADR-034 — Postgres deployments get the same keyword-search capability as SQLite, not just relational-schema parity."
    track: "database"
    deliverables:
      - "docker-compose.yml's postgres service (profile-gated in phase 3) switched to a ruvector-postgres image (Ruvnet's prebuilt Docker Hub image, or a project-built equivalent if that proves impractical) with `CREATE EXTENSION ruvector;` applied via a Postgres-only migration/init step."
      - "A term/document-frequency maintenance path for the emails table (subject, from_name, from_addr, body_text, labels) — the Postgres-side equivalent of FTS5's content-sync triggers from migrations 005/019 — feeding ruvector_bm25_score(). Approximate the existing 6-column BM25 weight vector from ADR-029 (subject x10, from_name x5, from_addr x3, body_text x1, labels x2) as closely as ruvector-postgres's scoring function allows; document any unavoidable divergence."
      - "The backend's existing hybrid search code path (ADR-001) queries ruvector_bm25_score() for the keyword-ranking half when connected to Postgres, instead of the SQLite FTS5 query it uses today — same hybrid fusion logic, different keyword-scoring backend."
      - "docs/deployment-guide.md's interim full-text-search gap note (phase 4) updated to describe the shipped capability instead of the gap."
    definition_of_done:
      - "cmd: a throwaway ruvector-postgres container (docker run) accepts CREATE EXTENSION ruvector and the new migration/init step cleanly"
      - "cmd: cd backend && EMAILIBRIUM_DATABASE_URL=postgres://... cargo test passes, including new tests proving keyword search against a live ruvector-postgres instance returns emails ranked by BM25 relevance (mirroring the existing FTS5 test intent)"
      - "grep:absent: the interim full-text-search gap language in docs/deployment-guide.md (the phrase phase 4 introduced and this phase makes obsolete)"
      - "prose: the term/document-frequency maintenance path is documented at its call site, citing ADR-034 and noting where its BM25 weighting diverges (if at all) from the SQLite FTS5 weight vector"
    conventions: "Match ADR-034's decision exactly — do not substitute tsvector or a different extension without a fresh ADR. Match the existing hybrid-search code's structure in the vectors/ module (ADR-001) rather than building a parallel search path. The per-backend keyword-scoring queries use ADR-036's raw-SQL escape-hatch pattern (Statement::from_sql_and_values on conn.get_database_backend()), each citing ADR-035's catalog — never a revived match-dispatch."
    depends_on: [1, 4]
    touches:
      [
        "docker-compose.yml",
        "docker-compose.dev.yml",
        "backend/migrations/postgres/**",
        "backend/src/vectors/**",
        "docs/deployment-guide.md",
      ]
    adrs: ["ADR-034-postgresql-fulltext-search-ruvector-bm25", "ADR-001", "ADR-029"]
    ddd: []
