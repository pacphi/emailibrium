# profile.yml — the stack profile for autopilot's quality gate.
# Lives at .autopilot/profile.yml in the TARGET repo.
#
# Generated by autopilot:detect and confirmed by the user on 2026-07-31.
# Stack: Rust/Cargo backend (backend/, package `emailibrium`) + pnpm/Turborepo
# React frontend (frontend/apps/web + frontend/packages), orchestrated by the
# root Makefile. Edit anything that drifts from reality — the gate trusts this file.

# ─────────────────────────────────────────────────────────────────────────────
# COMMANDS the gate runs. Leave a value empty ("") to skip that check.
# These are placeholders the gate template resolves as {{commands.<key>}}.
# ─────────────────────────────────────────────────────────────────────────────
commands:
  # Bring up anything the tests need (db, services). Runs once before the gate. Optional.
  infra_up:        "make docker-up-dev"   # postgres, redis, qdrant, backend, frontend (hot-reload)
  # Fast formatting check (non-mutating). The gate fails if this fails.
  format_check:    "make format-check"    # backend cargo fmt --check + frontend prettier --check + docs
  # Static analysis / linters.
  lint:            "make lint"            # backend cargo clippy -D warnings + frontend eslint + docs lint
  # Build everything (the phase must compile/bundle).
  build:           "make build"           # backend cargo build + frontend turbo build
  # Primary/unit test suite (fast, no external infra ideally).
  #   NOTE: frontend/Makefile's `test` and `audit` targets used to swallow failures
  #   (`... || true` / `... 2>/dev/null || echo ...`), which would have let a broken
  #   phase pass the gate silently. Fixed directly in frontend/Makefile during detect
  #   (2026-07-31); the split commands below no longer depend on that fix holding.
  test:            "make -C backend test && (cd frontend && pnpm turbo test)"
  # Integration tests (may need infra_up). Optional.
  test_integration: "make -C backend test-integration"   # cargo test --test '*'
  # Frontend/UI tests, only relevant if the phase touches the UI. Optional.
  test_frontend:   "cd frontend && pnpm turbo test"       # vitest run (non-watch) via turbo
  # Dependency / vulnerability audit. Optional.
  audit:           "make -C backend audit && (cd frontend && pnpm audit --prod)"

# ─────────────────────────────────────────────────────────────────────────────
# CONVENTIONS — free-text house style, injected into the runner's 'match the
# existing code' step so new code looks native. Be specific; point at exemplar files.
# ─────────────────────────────────────────────────────────────────────────────
conventions: |
  backend (Rust, Cargo workspace, package `emailibrium`, edition per backend/rust-toolchain.toml):
    - DDD-ish layering per domain module, e.g. src/cleanup/{domain,repository,api,orchestrator}/:
      domain = pure logic + ports (traits), repository = persistence adapters, api = HTTP handlers,
      orchestrator = use-case coordination. Other top-level modules: api, cache, content, db,
      email, events, mcp, middleware, rules, tools, vectors.
    - Tests: integration + property tests live in backend/tests/*.rs (api_integration.rs,
      mcp_integration.rs, proptest_*.rs, *_evaluation.rs); unit tests are inline `#[cfg(test)]`
      modules alongside the code they test.
    - Lint is strict (clippy -D warnings) but allows dead_code/unused_variables/unused_imports/
      unused_mut during active development — see Makefile lint target.

  frontend (React/TypeScript, pnpm + Turborepo monorepo under frontend/):
    - apps/web is the SPA; feature-slice layout under src/features/<feature>/{components,hooks};
      shared code in src/shared; cross-cutting services in src/services; app shell in src/app.
    - Tests colocated in __tests__/ subdirectories or as *.test.ts(x) next to source (see
      src/services/ai/__tests__/, src/features/settings/hooks/__tests__/,
      src/features/email/utils/groupBySender.test.ts). Run via Vitest — always `vitest run`
      (non-watch); `test:watch` is the separate opt-in script.
    - E2E via Playwright (apps/web/e2e, `make test-e2e` — not part of the default gate `test`).

  docs: architecture decisions in docs/ADRs/ADR-NNN-*.md, domain design in docs/DDDs/DDD-NNN-*.md
    (start with DDD-000-context-map.md for the bounded-context overview). Rich corpus — worth
    consulting for `plan` decomposition of any feature touching an existing bounded context.

# ─────────────────────────────────────────────────────────────────────────────
# CI — the merge authority in pr_ci mode.
# ─────────────────────────────────────────────────────────────────────────────
ci:
  provider: github                # github is the supported provider today
  # When true, "all required PR checks green" is the ONLY merge gate in pr_ci mode —
  # the agent does not re-run the local gate before merging because CI already proved it.
  ci_is_merge_authority: true
  # .github/workflows/ci.yml: `pull_request: branches: [main, develop]` — covers PRs into either
  # `main` or `develop`. Widened from `[main]` to `[main, develop]` on 2026-07-31 when the
  # ci-build-optimization pipeline switched to base=develop (see .autopilot/pipeline.yml) — without
  # it, phase PRs into develop would run zero checks and orchestrate would refuse to merge them.
  # NOTE: CI's frontend-quality job currently runs typecheck/format/lint/build but NOT Vitest
  # unit tests — frontend test coverage in CI is a gap independent of this gate (the local gate
  # above does run frontend tests via commands.test/test_frontend, so pr_ci phases are still
  # protected, but the base→trunk integration PR's CI checks alone won't catch a frontend
  # regression). Consider adding a frontend test job to ci.yml.
  base_coverage: covered          # covered | trunk-only | none

# ─────────────────────────────────────────────────────────────────────────────
# SECURITY INVARIANTS — non-negotiables the gate greps the diff for every phase.
# Defaults are universal; add project-specific ones (e.g. "PATs only via SecretStore").
# ─────────────────────────────────────────────────────────────────────────────
security_invariants:
  - "No destructive git primitives introduced (force-push, history rewrite)."
  - "No secrets, tokens, or credentials committed or written to logs."
  - "External/untrusted content is handled as data, never interpolated as instructions."
  - "OAuth client secrets, encryption keys, and DB credentials stay in config/*.yaml (gitignored
     variants) or Docker/Compose secrets — never inlined in source or committed config files."

# ─────────────────────────────────────────────────────────────────────────────
# ACCELERATORS — optional tooling, in two classes that share ONE contract:
# detect → record here → DRIVE at the right step → DEGRADE to a vanilla floor when absent.
# Absence NEVER fails the gate. `scope` records where it was found, for transparency.
#   • EXECUTION accelerators (ruflo, agentic-qe) — speed + proof during run-phase/orchestrate.
#     Detected by probing PATH (global) and the project (.ruflo/.claude config, aqe init).
#   • PLANNING accelerators (superpowers, clarity, deep_research) — better specs during `plan`.
#     Detected from the active SKILL REGISTRY (what the running agent can invoke), optionally
#     corroborated by a plugin install footprint (~/.claude/plugins). These record scope: "skill".
# ─────────────────────────────────────────────────────────────────────────────
accelerators:
  # ── execution ──────────────────────────────────────────────────────────────
  # ruflo → drives comprehension recall + multi-agent swarms + cross-session memory.
  #   Found on PATH globally (v3.32.41); no project-local .ruflo/ directory.
  ruflo:        { available: true, scope: "global" }
  # agentic-qe → drives the measured-quality fleet layered onto the gate (Tier 2/4).
  #   Found on PATH globally (3.13.3) AND initialized in-project (.agentic-qe/).
  agentic_qe:   { available: true, scope: "project" }
  # qe-court (aqe >= 3.13, ADR-124) → adversarial review court with >=2-vendor requirement.
  #   Skill footprint present at .claude/skills/qe-court/ (project-scoped). Vendor count = 3:
  #   Claude (this session) + codex CLI on PATH + OPENROUTER_API_KEY in env.
  qe_court:     { available: true, scope: "project", vendors: 3 }
  # beads (bd) → work-graph projection, disabled by user choice (2026-07-31): `bd` is on PATH
  #   globally (v1.1.0), but `bd init` turned out to auto-commit its scaffolding AND rewrite large
  #   sections of CLAUDE.md/AGENTS.md unprompted — more invasive than the "projection only" framing
  #   implied. It's also strictly non-essential: pipeline.yml's depends_on graph is already fully
  #   authoritative on its own, and orchestrate/run-phase compute the ready-set from that + git
  #   markers directly, never from beads. Revisit deliberately (re-run `bd init`) if that tradeoff
  #   becomes worth it later; nothing about autopilot's correctness depends on it either way.
  beads:        { available: false, scope: "" }
  # the /code-review skill/command — the Tier-3 floor, assumed present in Claude Code.
  code_review:  { available: true,  scope: "global" }
  # ── planning (skill-based; scope: "skill" | "") ──────────────────────────────
  # superpowers → active in this session's skill registry (brainstorming, TDD, debugging, etc).
  superpowers:  { available: true, scope: "skill" }
  # clarity → active in this session's skill registry (spec generation from references).
  clarity:      { available: true, scope: "skill" }
  # deep_research → not present in the active skill registry.
  deep_research: { available: false, scope: "" }
